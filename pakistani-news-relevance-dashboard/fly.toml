app = "your-app-name"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

# If your app requires persistent storage for images, uncomment and configure mounts after
# you create a volume with `flyctl volumes create data --size 3` and set the app name above.
# [[mounts]]
#   source = "data"
#   destination = "/app/data/raw/images"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  processes = ["web"]

  [[services.ports]]
    port = 80

  [[services.ports]]
    port = 443

  [[services.tcp_checks]]
    interval = 10000
    timeout = 2000
    restart_limit = 0
